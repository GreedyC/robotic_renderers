[project]
name = "robotic-renderers-mitsuba-runtime"
version = "0.1.0"
description = "Pinned Linux/CUDA runtime for the robotic-renderers Mitsuba backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mitsuba==3.9.0",
  "numpy>=2.5.1,<3",
  "pillow>=12.3,<13",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
