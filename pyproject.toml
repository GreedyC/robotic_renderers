[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "robotic-renderers"
version = "0.1.0"
description = "Compare rendering pipelines on one deterministic Franka FR3 scene"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = [
  "LICENSE",
  "third_party/mujoco_menagerie/LICENSE",
  "third_party/mujoco_menagerie/franka_fr3/LICENSE",
]
authors = [
  { name = "Tarik Kelestemur" },
]
keywords = [
  "blender",
  "franka",
  "mitsuba",
  "mujoco",
  "rendering",
  "robotics",
  "simulation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "imageio>=2.37.4,<3",
  "imageio-ffmpeg>=0.6.0,<0.7",
  "mujoco==3.13.0",
  "numpy>=2.5.3,<3",
  "pillow>=12.3,<13",
  "pygame-ce>=2.5.8,<3",
]

[project.optional-dependencies]
all = [
  "mujoco-warp==3.13.0",
  "usd-core==26.8",
  "warp-lang==1.17.0",
]
ovrtx = [
  "usd-core==26.8",
]
warp = [
  "mujoco-warp==3.13.0",
  "warp-lang==1.17.0",
]

[project.scripts]
robotic-renderers = "robotic_renderers.cli:main"
robotic-renderers-throughput = "robotic_renderers.benchmarks.throughput:main"

[project.urls]
Changelog = "https://github.com/tkelestemur/robotic_renderers/blob/main/CHANGELOG.md"
Documentation = "https://github.com/tkelestemur/robotic_renderers/tree/main/docs"
Issues = "https://github.com/tkelestemur/robotic_renderers/issues"
Repository = "https://github.com/tkelestemur/robotic_renderers"

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16.6,<1",
]
renderers = [
  "mujoco-warp==3.13.0",
  "usd-core==26.8",
  "warp-lang==1.17.0",
]

[tool.uv]
default-groups = ["dev", "renderers"]
package = true

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/THIRD_PARTY.md",
  "/docs",
  "/runtime",
  "/src",
  "/tests",
  "/third_party/mujoco_menagerie",
]

[tool.hatch.build.targets.wheel]
packages = ["src/robotic_renderers"]

[tool.hatch.build.targets.wheel.force-include]
"third_party/mujoco_menagerie/franka_fr3" = "robotic_renderers/data/franka_fr3"
"third_party/mujoco_menagerie/LICENSE" = "robotic_renderers/data/mujoco_menagerie.LICENSE"
"runtime/cosmos" = "robotic_renderers/data/runtime/cosmos"
"runtime/mitsuba" = "robotic_renderers/data/runtime/mitsuba"
"runtime/ovrtx" = "robotic_renderers/data/runtime/ovrtx"
"runtime/warp" = "robotic_renderers/data/runtime/warp"

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA/RTX device",
  "integration: requires an external renderer or graphics context",
  "remote: requires SSH or a remote service",
]

[tool.coverage.run]
branch = true
source = ["robotic_renderers"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.ruff]
extend-exclude = [
  ".venv",
  "build",
  "dist",
  "outputs",
  "third_party",
]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
