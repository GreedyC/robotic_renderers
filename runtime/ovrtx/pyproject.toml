[project]
name = "robotic-renderers-ovrtx-runtime"
version = "0.1.0"
description = "Pinned Linux/RTX runtime for the robotic-renderers ovrtx backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.3",
  "ovrtx==0.5.0.377615",
  "ovstage==0.2.0.377349",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
