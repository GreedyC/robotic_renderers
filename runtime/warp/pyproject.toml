[project]
name = "robotic-renderers-warp-runtime"
version = "0.1.0"
description = "Pinned Linux/CUDA runtime for the robotic-renderers Warp worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "imageio==2.37.4",
  "imageio-ffmpeg==0.6.0",
  "mujoco==3.11.0",
  "mujoco-warp==3.11.0",
  "numpy==2.5.1",
  "pillow==12.3.0",
  "usd-core==26.8",
  "warp-lang==1.15.0",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
