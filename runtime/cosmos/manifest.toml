[runtime]
name = "cosmos3-super"
platform = "linux-x86_64"
python = "3.12"
torch-backend = "cu130"
minimum-gpu-count = 4
default-gpu-ids = [0, 1, 2, 3]
gpu-selection-environment = "ROBOTIC_RENDERERS_COSMOS_GPU_IDS"
topology-guidance = "Select GPUs on one NUMA node when possible."

[python-packages]
# vLLM-Omni 0.28.0 requires the matching vLLM release line (not vLLM 0.29).
vllm = "0.28.0"
vllm-omni-repository = "https://github.com/vllm-project/vllm-omni.git"
vllm-omni-commit = "eb11446b7f2e30ca582f8aff3afe12e9a2e66f6c"

[model]
repository = "nvidia/Cosmos3-Super"
revision = "e0262be9d8f7586bc24c069a2aed2b665bdff266"
precision = "BF16"
