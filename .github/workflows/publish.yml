name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

jobs:
  pypi:
    name: Publish trusted release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.12"
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@v1.14.2
